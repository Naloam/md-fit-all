<svg xmlns="http://www.w3.org/2000/svg" width="860" height="430" viewBox="0 0 860 430" font-family="Cascadia Code, Consolas, Menlo, monospace">
  <style>
    .panel { rx: 10; }
    .fade-a { opacity: 0; animation: showA 8s infinite; }
    .fade-b { opacity: 0; animation: showB 8s infinite; }
    .key { opacity: 0; animation: keyFlash 8s infinite; }
    .arrow { opacity: 0; animation: arrowShow 8s infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes showA { 0% {opacity:1} 36% {opacity:1} 44% {opacity:0} 96% {opacity:0} 100% {opacity:1} }
    @keyframes showB { 0% {opacity:0} 36% {opacity:0} 44% {opacity:1} 96% {opacity:1} 100% {opacity:0} }
    @keyframes keyFlash { 0%,26% {opacity:0; transform:scale(.9);} 30% {opacity:1; transform:scale(1);} 36% {opacity:1;} 42% {opacity:0;} 100% {opacity:0;} }
    @keyframes arrowShow { 0%,28% {opacity:0;} 33% {opacity:1;} 40% {opacity:1;} 46% {opacity:0;} 100% {opacity:0;} }
    @keyframes blink { 50% {opacity:0} }
    .key, .arrow { transform-origin: center; transform-box: fill-box; }
    .green { fill: #34d399; }
    .dim { fill: #8b949e; }
    .title { fill: #e6edf3; font-size: 15px; font-weight: bold; }
    .mono { fill: #c9d1d9; font-size: 13.5px; }
    .hl { fill: #f0883e; }
    .ok { fill: #7ee787; }
  </style>

  <rect width="860" height="430" fill="#0d1117"/>
  <text x="30" y="40" class="title">mdfit — fit any Markdown into any editor</text>

  <!-- left: chat source -->
  <rect class="panel" x="30" y="60" width="360" height="330" fill="#161b22" stroke="#30363d"/>
  <circle cx="52" cy="86" r="5" fill="#f85149"/><circle cx="70" cy="86" r="5" fill="#d29922"/><circle cx="88" cy="86" r="5" fill="#3fb950"/>
  <text x="180" y="91" text-anchor="middle" class="dim" font-size="12">ChatGPT · copy</text>

  <g class="fade-a">
    <text x="52" y="126" class="hl">### 卷积的输出</text>
    <text x="52" y="152" class="mono">设输入特征图，输出为：</text>
    <text x="52" y="180" class="hl">\[ Y = X * K \]</text>
    <text x="52" y="208" class="mono">其中核为 \(K\)。</text>
    <text x="52" y="236" class="mono">计算量降为 \(1/k^2\)</text>
    <text x="52" y="264" class="hl">【1†source】</text>
    <text x="52" y="292" class="mono">```py</text>
    <text x="52" y="310" class="mono">conv = nn.Conv2d(...)</text>
    <text x="52" y="328" class="mono">```</text>
    <text x="52" y="360" class="dim">\( \) 定界符 · ### 层级 · 引用标记</text>
  </g>

  <!-- right: obsidian result -->
  <rect class="panel" x="470" y="60" width="360" height="330" fill="#161b22" stroke="#30363d"/>
  <circle cx="492" cy="86" r="5" fill="#a371f7"/><circle cx="510" cy="86" r="5" fill="none" stroke="#8b949e"/><circle cx="528" cy="86" r="5" fill="none" stroke="#8b949e"/>
  <text x="650" y="91" text-anchor="middle" class="dim" font-size="12">Obsidian · paste</text>

  <g class="fade-b">
    <text x="492" y="126" class="ok"># 卷积的输出</text>
    <text x="492" y="152" class="mono">设输入特征图，输出为：</text>
    <text x="492" y="180" class="ok">$$ Y = X * K $$</text>
    <text x="492" y="208" class="mono">其中核为 $K$。</text>
    <text x="492" y="236" class="mono">计算量降为 $1/k^2$</text>
    <text x="492" y="270" class="mono">```python</text>
    <text x="492" y="288" class="mono">conv = nn.Conv2d(...)</text>
    <text x="492" y="306" class="mono">```</text>
    <text x="492" y="360" class="dim">$ 数学 · # 顶层标题 · 引用已清理</text>
    <text x="806" y="370" class="cursor ok">▊</text>
  </g>

  <!-- middle: hotkey -->
  <g class="key">
    <rect x="415" y="195" width="30" height="26" rx="5" fill="#21262d" stroke="#30363d"/>
    <rect x="415" y="168" width="30" height="24" rx="5" fill="#21262d" stroke="#30363d"/>
    <text x="430" y="184" text-anchor="middle" class="mono" font-size="10">⌃⎇</text>
    <text x="430" y="212" text-anchor="middle" class="mono" font-size="12" fill="#7ee787">V</text>
  </g>
  <g class="arrow">
    <path d="M 400 210 L 410 210 L 410 206 L 420 212 L 410 218 L 410 214 L 400 214 Z" fill="#7ee787"/>
    <text x="430" y="248" text-anchor="middle" class="dim" font-size="10">98ms</text>
  </g>
</svg>
